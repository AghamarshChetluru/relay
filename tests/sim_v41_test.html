var mc=C.T('#msgcard');C.chg('#msgpick',sp);await sleep(100);ok(/new packet/i.test(C.T('#msgcard'))&&/not guaranteed/.test(C.T('#msgcard'))&&!/Travels with its request/.test(C.T('#msgcard')),'3 Explore: the sighting reply is described as a new packet with its own route');
C.click('#tab-inspect');C.chg('#phonepick',E3);ok(!/Clinic|volunteer/i.test(C.T('#devcard'))&&/Phone p/.test(C.T('#devcard')),'3 Explore inspection names the responder neutrally: "'+C.T('#devcard strong').slice(0,40)+'"');
finish('3 missing person',C);

/* ================= 3b. the audit's exact case in Explore: 52 hold it, 11 connected phones are not eligible ================= */
C=await page('?mode=explore');M=C.M;X=C.X;API=C.API;ST=C.ST;K=C.K;API.setScenario('missing');await sleep(100);C.chg('#speed','4');
C.click('#btn-do');C.click('#btn-do');ok(await C.waitFor(function(){return /Stalled/.test(C.T('#sim-head'))},90000),'3b missing person stalls at the gap in Explore');
C.click('#btn-do');C.click('#inst-send');C.click('#inst-accept');await sleep(100);C.click('#btn-play');ok(await C.waitFor(function(){return !ST.playing},120000),'3b Play runs until the packet stops');
var mp2=API.mainPid(),r2=X.reach(mp2),s2=X.stopReason(mp2),nb2=C.T('#sim-body');
ok(r2.eligibleNext.length===0&&r2.connected.length>0&&r2.heldBack.length+r2.connectedOther.length===r2.connected.length&&s2.code==='policy','3b engine: '+r2.holders.length+' hold it; '+r2.connected.length+' connected, none eligible ('+r2.heldNow.length+' not selected now, '+r2.heldFixed.length+' blocked for this copy, '+r2.connectedOther.length+' not next to a holder); stop = '+s2.code);
ok(r2.holders.length===53&&r2.connected.length===10&&r2.heldNow.length===1&&r2.heldFixed.length===1&&r2.connectedOther.length===8&&r2.cutOff.length===1,'3b engine snapshot for the shipped V4.2 topology: 53 hold it, 10 connected, 1+1 next to a holder, 8 not adjacent, 1 cut off (V4.1: 52/11/3/8/1)');
ok(/Stopped by its routing policy/.test(C.T('#sim-head'))&&new RegExp(r2.connected.length+' more phones are connected to a holder').test(nb2)&&new RegExp(r2.heldBack.length+' next to a holder that is not selecting them, '+r2.connectedOther.length+' not next to any holder').test(nb2)&&new RegExp(r2.cutOff.length+' more phone is cut off by a gap').test(nb2)&&/Connected does not mean it will be delivered/.test(nb2),'3b Explore explains it as policy-limited, with the real split and the separate 1-phone gap: "'+nb2.slice(0,150)+'..."');
ok(s2.waiting&&/This is not final: at simulated minute \d+/.test(nb2)&&nb2.indexOf('minute '+s2.wakeTick)>=0,'3b the stop is not presented as final: the engine says a time-based detour is due at minute '+s2.wakeTick+' and Explore says so');
ok(+C.T('#r-reach')===r2.connected.length&&+C.T('#r-cut')===r2.cutOff.length&&+C.QA('#reach-detail dt')[1].textContent===r2.heldNow.length&&+C.QA('#reach-detail dt')[2].textContent===r2.heldFixed.length&&+C.QA('#reach-detail dt')[3].textContent===r2.connectedOther.length&&/not next to any holder/.test(C.T('#reach-detail')),'3b the numbers card agrees with the engine on every figure');
ok(!/could still receive/i.test(C.T('#explore'))&&C.T('#m-dest')==='' ||/Connected: this policy may not send it there|Reached|Unreachable|Pending/.test(C.T('#m-dest')),'3b a steered packet\'s destination status never says a plain "Pending: a Relay route exists"');
finish('3b explore policy case',C);

/* ================= 4. community: reports are reports, in the poster\'s own area; priority from a real contest ================= */
C=await page();M=C.M;X=C.X;API=C.API;ST=C.ST;K=C.K;API.setScenario('broadcast');await sleep(150);
var P=API.poster(),pa=C.S().nodes[P].area;ok(/reports a water collection point in /.test(C.T('#s-sub'))&&C.T('#s-sub').indexOf(pa)>=0&&/unverified/.test(C.T('#s-sub')),'4 "'+C.T('#s-sub')+'" (a report, in the poster\'s declared area)');
var pv=C.T('.ph');ok(/declares/.test(pv)&&pv.indexOf('reports a water collection point in '+pa)>=0&&!/City Hall|north entrance/.test(pv),'4 draft is stated as a report in '+pa+', with no place the poster cannot support');
C.click('#s-primary');var bp=ST.ctx.bpid,pay=C.S().packets[bp].payload;ok(pay.area===pa&&/A neighbour reports a water collection point in /.test(pay.text)&&/Not verified/.test(pay.text),'4 payload area ('+pay.area+') = the poster\'s declared area; text is a report: "'+pay.text+'"');
ok(await C.waitFor(function(){return C.mom()==='gap'},90000),'4 the report stalls at the gap');C.click('#s-primary');C.click('#s-accept');await sleep(100);C.click('#s-primary');
ok(await C.waitFor(function(){return C.mom()==='intro'},90000),'4 the report crosses to the requester side');
C.click('#s-primary');var up=ST.ctx.urgentPid,ub=C.S().packets[up].payload;ok(ub.area===pa&&ub.title==='Medical help needed in '+pa&&/Not verified/.test(ub.description),'4 the urgent request is also stated in '+pa+' and as a report ("'+ub.title+'")');
await sleep(100);ok(C.mom()==='ready'&&!/urgent messages go first/.test(C.T('#s-head')),'4 priority is not claimed before the engine has resolved a busy link');
C.click('#s-to-explore');await sleep(120);C.chg('#msgpick',bp);C.click('#to-story');await sleep(150);
ok(C.mom()==='ready'&&/Send both onward/.test(C.T('#s-primary')),'4 after Explore selected an older packet, Story still offers the right action');
C.click('#s-primary');await sleep(150);var cc=API.contested()[0];ok(C.mom()==='contest'&&!!cc&&C.S().packets[cc.w.winner].prio<=C.S().packets[cc.w.pid].prio&&C.QA('#s-net .se.focus').length===1,'4 the busy-link claim comes from a real capacity contest and one link is singled out');
finish('4 community',C);

/* ================= 5. adversarial sequences ================= */
C=await page();M=C.M;X=C.X;API=C.API;ST=C.ST;K=C.K;
C.click('#s-primary');await sleep(1500);C.click('#s-primary');                                                       /* Pause mid-spread */
C.click('#s-step');C.click('#s-step');C.check('step during spread');
ok(M.stats(API.mainPid()).held>=2,'5 Step during spread advances the engine one step at a time');
C.click('#s-restart');await sleep(150);ok(M.state().tick===0&&Object.keys(M.state().packets).length===0&&C.mom()==='need'&&!ST.playing,'5 Reset mid-propagation: engine at tick 0, no packets, story at the start, nothing still playing');
C.click('#s-primary');await C.waitFor(function(){return C.mom()==='gap'});C.click('#s-primary');ok(!!C.Q('#s-consent'),'5 consent opens at the gap');
C.d.dispatchEvent(new C.w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await sleep(60);ok(!C.Q('#s-consent')&&!M.state().nodes[K().D].hasApp,'5 Escape closes it and nothing is installed');
C.click('#s-primary');C.click('#s-notnow');await sleep(60);ok(!C.Q('#s-consent')&&!M.state().nodes[K().D].hasApp,'5 "Not now" installs nothing');
API.setScenario('missing');await sleep(150);ok(C.mom()==='need'&&M.state().tick===0&&C.ST.scen==='missing','5 switching scenarios before completion starts the new one clean');
C.click('#s-primary');await sleep(800);API.setScenario('broadcast');await sleep(150);ok(C.mom()==='need'&&!ST.playing&&Object.keys(M.state().packets).length===0,'5 switching scenarios while messages are moving stops playback and clears the world');
API.setScenario('emergency');await sleep(100);
await emergencyToRespond(C);C.click('#s-primary');await sleep(300);
for(var t=0;t<6;t++){var chipEl=C.QA('.ph.chip')[0]||C.QA('.ph')[0];if(chipEl)chipEl.click();await sleep(40)}C.check('toggling previews');ok(C.QA('.ph').length<=2,'5 repeatedly opening and closing previews leaves a consistent screen');
ok(await C.waitFor(function(){return C.mom()==='arrived'},60000),'5 the reply still arrives after all that');C.click('#s-primary');await C.waitFor(function(){return C.mom()==='done'});
C.click('#s-replay');await sleep(150);ok(C.mom()==='need'&&M.state().tick===0,'5 Replay after completion restarts cleanly');
/* expiry */
C.click('#s-primary');var ep=API.mainPid();C.click('#s-primary');for(var e2=0;e2<120&&!M.isExpired(M.state().packets[ep]);e2++){API.pause();API.doStep()}
await sleep(100);ok(M.isExpired(M.state().packets[ep])&&C.mom()==='expired'&&/The request expired/.test(C.T('#s-head'))&&/lived 90 simulated minutes/.test(C.T('#s-sub')),'5 expiry: "'+C.T('#s-head')+'" / "'+C.T('#s-sub')+'"');
ok(!/one phone without Relay|can.t go any further/.test(C.T('#s-root'))&&!C.Q('#s-primary')&&!!C.Q('#s-replay'),'5 an expired message is not explained as a gap, offers no action, and can be replayed');
C.click('#s-to-explore');await sleep(120);ok(/Message expired/.test(C.T('#sim-head'))&&/lifetime/.test(C.T('#sim-body')),'5 Explore agrees: "'+C.T('#sim-head')+'"');C.click('#to-story');await sleep(150);ok(C.mom()==='expired','5 Story still agrees after the round trip');
/* new tab content: limits */
C.click('#s-to-explore');await sleep(100);ok(/still get no reply/.test(C.T('#limits')),'5 Explore says a request can reach many phones and still get no reply');
ok(!/clinic|volunteer|nurse/i.test(C.T('#explore')),'5 Explore (normal mode) shows no legacy clinic/volunteer wording');
finish('5 adversarial',C);

C=await page('?mode=explore');M=C.M;X=C.X;API=C.API;ST=C.ST;K=C.K;

C.click('#btn-do');ok(!/Clinic|volunteer/i.test(C.T('#modal'))&&/declares/.test(C.T('#modal')),'6 the install dialog names phones neutrally and by declared area: "'+C.T('#modal p').slice(0,90)+'"');

C.click('#btn-do');ok(await C.waitFor(function(){return !!API.responder()&&M.nodeHas(API.responder(),API.mainPid())},90000),'6 Explore also waits for a real far-side phone to receive the request before it can respond');
ok(!/Clinic|volunteer/i.test(C.T('#explore').replace(/\bvolunteer\b(?=[^.]*offers)/g,'')),'6 no legacy names in Explore');

}
run().catch(function(e){out.push('EXC '+e.message+' '+(e.stack||'').split('\n')[1])}).then(function(){document.getElementById('out').textContent='RESULTS w='+W+'\n'+out.join('\n')+'\nEND'});
