 var UN=await load('inbox_s1');UN.w.__refreshRes={state:'unsupported'};UN.click('#btn-refresh');ok(/no Bluetooth LE/.test(UN.T('#refreshnote')),'10 no BLE: says so');
 ok(!/server|cloud|online|internet/i.test(F.T('#refreshnote')+BT.T('#refreshnote')+PM.T('#refreshnote')),'10 nothing suggests a server or the internet');
 var HB=await load('inbox_s1');ok(HB.Q('#btn-refresh').getAttribute('aria-label')==='Check for new messages'&&HB.Q('#btn-refresh').getBoundingClientRect().height>=43.5,'10 the refresh button is labelled and a full-size touch target');

 /* ================= 11. many messages: never one uninterrupted list ================= */
 var M=await load('inbox_many');M.nav('feed');
 ok(M.cards('#grp-new').length===4&&!!M.Q('[data-more=new]'),'11 "New to you" shows 4 of '+(M.QA('[data-more=new]').length?'many':'')+' with a "Show more" control');
 var firstView=M.cards('#inbox-body').length;ok(firstView<=4&&firstView>0,'11 20 unread messages: the first screen shows '+firstView+', not all of them');
 M.click('[data-more=new]');await sleep(40);ok(M.cards('#grp-new').length>4,'11 "Show more" expands in place');
 var C2=await load('inbox_many','&read='+['x'].join(','));C2.nav('feed');
 /* mark everything read through the page's own markRead to see Active / Community limits */
 var ids=C2.w.RelayNative.snap.packets.map(function(p){return p.id});C2.w.__readExtra={};ids.forEach(function(i){C2.w.__readExtra[i]=1});await C2.push();
 ok(C2.cards('#grp-active').length<=5&&!!C2.Q('[data-more=active]')&&C2.cards('#grp-updates').length<=3&&!!C2.Q('[data-more=updates]'),'11 read: at most 5 active requests and 3 community updates are shown before "Show more" ('+C2.cards('#grp-active').length+' / '+C2.cards('#grp-updates').length+')');
 C2.layout('many');

 /* ================= 12. about: system alerts state ================= */
 var AB=await load('inbox_s1');AB.w.__notif={enabled:false,canAsk:true};AB.click('#btn-info');await sleep(60);
 ok(/Off\. In-app banners still work/.test(AB.sheet())&&!!AB.Q('#notif-enable'),'12 when Android alerts are off the About sheet says so, and in-app banners still work');AB.click('#notif-enable');ok(AB.calls('requestNotifications').length===1,'12 the button asks Android for permission');
 var errs=[A,B,C,D,S,R,F,M,N1,N2,V,E,G,Q1,Q2,Q3,Q4,Q5].reduce(function(a,x){return a.concat(x.errs)},[]);ok(errs.length===0,'no runtime errors in any page ('+errs.slice(0,2).join('; ')+')');
}
run().catch(function(e){out.push('EXC '+e.message+' '+(e.stack||'').split('\n').slice(1,3).join(' | '))}).then(function(){document.getElementById('out').textContent='RESULTS w='+W+'\n'+out.join('\n')+'\nEND'});
