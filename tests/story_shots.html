<!DOCTYPE html><html><body style="margin:0;background:#fff"><script>
/* Drives the real Story mode to a named state with its own buttons and the engine, so headless Chrome can screenshot it.
   usage: story_shots.html?s=<state>&w=1440&h=900&src=/abs/simulator.html */
var q=new URLSearchParams(location.search),W=+q.get('w')||1440,HH=+q.get('h')||900,SRC=q.get('src'),STATE=q.get('s')||'e0';
var fr=document.createElement('iframe');fr.style.cssText='width:'+W+'px;height:'+HH+'px;border:0;display:block';fr.src='file://'+SRC+(/^x/.test(STATE)?'?mode=explore':'');document.body.appendChild(fr);
fr.onload=function(){setTimeout(function(){go().catch(function(e){document.title='ERR '+e.message+' '+(e.stack||'').split('\n')[1]})},300)};
async function go(){
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var w=fr.contentWindow,d=w.document,M=w.Mesh,API=w.RelaySim.api,ST=w.RelaySim.state;function Q(s){return d.querySelector(s)}function click(s){var e=typeof s==='string'?Q(s):s;if(!e)throw new Error('missing '+s);e.click()}
function K(){return M.state().keys}function mom(){return w.RelayStory.moment().id}
function steps(n){for(var i=0;i<n;i++){API.pause();API.doStep()}}
function until(f,max){for(var i=0;i<(max||300)&&!f();i++){API.pause();API.doStep()}}
function primary(){click('#s-primary');API.pause()}               /* press the real action, then stop the auto-play so the state is deterministic */
function toGap(){primary();until(function(){return mom()==='gap'})}
function toConnect(){toGap();click('#s-primary');click('#s-accept')}
function toRespond(){toConnect();click('#s-primary');API.pause();until(function(){return mom()==='respond'||mom()==='intro'})}
var s=STATE;
if(/^m/.test(s))API.setScenario('missing');if(/^b/.test(s))API.setScenario('broadcast');
var E=function(){return K().E},A=function(){return K().A};
if(s==='e0'||s==='m0'||s==='b0'){}
else if(s==='e1'){primary()}
else if(s==='e2'){primary();steps(1)}
else if(s==='e3'){primary();steps(6)}
else if(s==='e4'){toGap()}
else if(s==='e4c'){toGap();click('#s-primary')}
else if(s==='e5'){toConnect()}
else if(s==='e6'){toConnect();click('#s-primary');API.pause();steps(2)}
else if(s==='e7'){toRespond()}
else if(s==='e8'){toRespond();click('#s-primary');API.pause();steps(3)}
else if(s==='e9'){toRespond();click('#s-primary');API.pause();until(function(){return mom()==='arrived'})}
else if(s==='e10'){toRespond();click('#s-primary');API.pause();until(function(){return mom()==='arrived'});click('#s-primary');API.pause();until(function(){return mom()==='done'})}
else if(s==='m3'||s==='m4'){click('#s-primary');for(var i=0;i<80&&mom()!=='decision'&&mom()!=='gap';i++)await sleep(250);API.pause();if(s==='m4'){click('#s-primary');await sleep(1800);API.pause();}}
else if(s==='b3'){primary();until(function(){return mom()==='intro'||mom()==='gap'});}
else if(s==='b4'){toConnect();click('#s-primary');API.pause();until(function(){return mom()==='intro'})}
else if(s==='b5'){toConnect();click('#s-primary');API.pause();until(function(){return mom()==='intro'});click('#s-primary')}
else if(s==='b6'){toConnect();click('#s-primary');API.pause();until(function(){return mom()==='intro'});click('#s-primary');click('#s-primary')}
else if(s==='mg'||s==='mc'||s==='mr'||s==='mrp'||s==='md'){click('#s-primary');API.pause();for(var i=0;i<400&&mom()!=='gap';i++){if(mom()==='decision')click('#s-primary');else{API.pause();API.doStep()}}
  if(s!=='mg'){click('#s-primary');click('#s-accept')}
  if(s==='mr'||s==='mrp'||s==='md'){click('#s-primary');API.pause();until(function(){return mom()==='respond'||mom()==='intro'})}
  if(s==='mrp'||s==='md'){click('#s-primary');API.pause();until(function(){return mom()==='arrived'})}
  if(s==='md'){click('#s-primary');API.pause();until(function(){return mom()==='done'})}}
else if(s==='bc'||s==='bd'){click('#s-primary');API.pause();until(function(){return mom()==='gap'});click('#s-primary');click('#s-accept');click('#s-primary');API.pause();for(var i=0;i<300&&mom()!=='done'&&(s==='bd'||mom()!=='intro');i++){if(mom()==='intro'||mom()==='respond'){click('#s-primary');API.pause()}else{API.pause();API.doStep()}}}
else if(s==='z1'){primary();var ep=API.mainPid();for(var i=0;i<200&&!M.isExpired(M.state().packets[ep]);i++){API.pause();API.doStep()}}
else if(s==='a1'){API.setScenario('missing');click('#s-primary');API.pause();for(var i=0;i<40&&mom()!=='decision';i++){await sleep(100)}API.pause();API.doStep();API.doStep()}
else if(s==='r1'){toRespond();click('#s-primary');API.pause();until(function(){return mom()==='arrived'});click('#s-to-explore');await sleep(200);click('#to-story');await sleep(200)}
else if(s==='x1'){API.setScenario('emergency');click('#btn-do');steps(4)}
document.title='READY '+s+' '+(w.RelayStory?w.RelayStory.moment().id:'')+' tick='+M.state().tick+' holders='+(API.mainPid()?M.holders(API.mainPid()).length:0);
}
</script></body></html>
