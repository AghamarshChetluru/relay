click('#s-primary');ok(await waitFor(function(){return mom()==='respond'},90000)&&/phone on the other side/.test(T('#s-head')),'10a the request reaches a phone on the other side');
var E2=API.responder();ok(!!E2&&M.nodeHas(E2,mrp)&&ST.ctx.install.newSet.indexOf(E2)>=0&&E2!==ST.ctx.install.id,'10a the missing-person responder ('+E2+', '+S().nodes[E2].area+') is a far-side phone that really holds the request');
click('#s-primary');var sp=ST.ctx.replyPid;ok(!!sp&&S().packets[sp].payload.kind==='sighting'&&!M.nodeHas(K().A,sp),'10a a possible sighting is created, not yet returned');
ok(await waitFor(function(){return mom()==='done'},90000)&&M.nodeHas(K().A,sp),'10a the sighting reaches the requester');
var rq2=QA('.ph').filter(function(p){return /Requester/.test(p.textContent)})[0];ok(/Unverified/.test(T('#s-root'))||(rq2&&/Unverified/.test(rq2.textContent)),'10a the sighting is marked unverified');
ok(/unverified/.test(T('#s-sub'))&&!/found|is safe|alive/i.test(T('#s-head')+T('#s-sub')),'10a no claim the child was found');
/* ===== 10b. community update: priority under constraint ===== */
API.setScenario('broadcast');await sleep(100);
ok(mom()==='need'&&/useful news/.test(T('#s-head')),'10b community update: "'+T('#s-head')+'"');
click('#s-primary');var bp=ST.ctx.bpid;ok(await waitFor(function(){return mom()==='gap'},90000),'10b the update stalls at the gap too');
click('#s-primary');click('#s-accept');await sleep(100);click('#s-primary');
ok(await waitFor(function(){return mom()==='intro'},90000)&&M.nodeHas(K().A,bp),'10b the update crosses to the other side');
click('#s-primary');var up=ST.ctx.urgentPid,b2=ST.ctx.bpid2;await sleep(100);
ok(mom()==='ready'&&!!up&&!!b2&&M.holders(up).join()===API.poster()&&M.holders(b2).join()===API.poster(),'10b the urgent request and a second update both start on one phone');
var P=API.poster();
ok(X.groupsFor(bp).holders.indexOf(API.poster())>=0&&S().packets[bp].originNodeId===API.poster(),'10b the poster is an ordinary Relay phone that started the update ('+API.poster()+')');
await layoutCheck('ready');
var qph=QA('.ph').filter(function(p){return /waiting to send/.test(p.textContent)})[0];
ok(!!qph&&qph.textContent.indexOf('Urgent')<qph.textContent.indexOf('Community update'),'10b the phone lists both waiting messages, urgent first (engine priority '+S().packets[up].prio+' < '+S().packets[b2].prio+')');
ok(!/urgent messages go first/.test(T('#s-head')),'10b the priority claim is NOT made before the engine has resolved a busy link');
click('#s-primary');await sleep(150);
await layoutCheck('contest');
ok(mom()==='contest'&&API.contested().length>0,'10b a real busy-link contest has now happened ('+API.contested().length+')');
var cc=API.contested()[0];ok(S().packets[cc.w.winner].prio<=S().packets[cc.w.pid].prio&&cc.w.from&&cc.w.to,'10b engine ordering: winner priority '+S().packets[cc.w.winner].prio+' <= waiter '+S().packets[cc.w.pid].prio);
ok(/urgent messages go first/.test(T('#s-head'))&&/went first/.test(T('#s-contest'))&&/waited/.test(T('#s-contest')),'10b busy-link chips show who went first and who waited');
ok(T('#s-contest').indexOf(X.packetInfo(cc.w.winner).name)<T('#s-contest').indexOf('went first')&&T('#s-contest').indexOf(X.packetInfo(cc.w.pid).name)>=0,'10b the chips name the real messages');
ok(QA('#s-net .se.focus').length===1,'10b the contested link is singled out on the map');
ok(+T('#s-metrics b').split(' ')[0]<=+T('#s-metrics b').split(' ')[2],'10b the count "'+T('#s-metrics b')+'" is derived from engine contests');
ok(!!E&&!!E2&&!!P&&[E,E2,P].every(function(i){return S().nodes[i]}),'who helps is chosen per scenario from phones the engine really places on the far side: emergency '+E+' ('+S().nodes[E].area+'), missing person '+E2+' ('+S().nodes[E2].area+'), community poster '+P+' ('+S().nodes[P].area+')');
ok(E!==K().E&&E2!==K().E&&P!==K().L&&E!==E2,'nothing is hard-wired: neither responder is the old fixed "clinic volunteer" phone ('+K().E+'), the poster is not the old fixed phone ('+K().L+'), and the two helpers differ');
/* ===== layout, copy, accessibility, offline ===== */
for(var sc of ['emergency','missing','broadcast']){API.setScenario(sc);await sleep(120);}
ok(Object.keys(seenMoments).length>=14,'moments exercised across scenarios: '+Object.keys(seenMoments).length);
ok(layoutBad.length===0,'layout at '+W+'x'+HH+': every moment keeps headline, network, preview and action in view'+(layoutBad.length?' -> '+layoutBad.join(' | '):''));
ok(bad.length===0,'truthfulness monitor over every paint: '+(bad.length?bad.slice(0,4).join(' | '):'no violations'));
var res=[].slice.call(d.scripts).map(function(x){return x.src}).concat([].slice.call(d.querySelectorAll('link[href],img[src],iframe[src]')).map(function(x){return x.href||x.src}));
ok(res.length>=5&&res.every(function(n){return /^file:/.test(n)}),'offline: only local files referenced ('+res.map(function(n){return n.split('/').pop()}).join(', ')+')');
ok(!/https?:\/\/(?!www\.w3\.org)/.test(d.documentElement.outerHTML.replace(/xmlns="[^"]*"/g,'')),'offline: no external URLs in the page');
ok(QA('#s-net circle.sn').length===80&&S().order.length===80&&QA('#s-net line.se').length===S().edges.length,'still the engine\'s 80 phones and '+S().edges.length+' links');
if(reduced)ok(QA('*').every(function(e){var c=w.getComputedStyle(e);return !c.animationName||c.animationName==='none'}),'reduced motion: no CSS animations');
ok(!/BLE connected|Bluetooth connected/i.test(d.body.textContent),'no fake hardware claims');
ok(errs.length===0,'no runtime errors: '+errs.join(';'));
}
