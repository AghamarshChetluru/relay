<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#146ce4">
<title>Relay – community help, even offline (prototype)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="appview" class="appview">
  <header class="topbar">
    <div class="toprow">
      <div class="brand"><span class="mark" aria-hidden="true"></span><div><strong>relay.</strong><small>Community, even offline.</small></div></div>
      <div class="topbtns">
        <button class="areabtn" id="area-chip" aria-label="Your area"></button>
        <button class="iconbtn" id="btn-refresh" aria-label="Check for new messages" title="Check for new messages"></button>
        <button class="iconbtn" id="btn-info" aria-label="About this prototype"></button>
      </div>
    </div>
    <div class="statusrow" id="statusrow"></div>
    <div class="refreshnote" id="refreshnote" role="status" aria-live="polite"></div>
    <button class="viewing" id="viewing" hidden></button>
  </header>
  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>
  <main id="screen" class="screen" tabindex="-1"></main>
  <nav class="bottomnav" aria-label="Main">
    <button data-nav="home"></button><button data-nav="request"></button><button data-nav="feed"></button><button data-nav="activity"></button>
  </nav>
</div>
<div id="sheetroot" class="sheetroot" hidden>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="sheethead"><h2 id="sheet-title"></h2><button class="iconbtn" id="sheet-close" aria-label="Close"></button></div>
    <div class="sheetbody" id="sheetbody"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="mesh.js"></script>
<script src="app.js"></script>
<script>window.RelayUI.start();</script>
</body>
</html>
