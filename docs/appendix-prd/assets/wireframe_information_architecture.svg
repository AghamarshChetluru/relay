<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <style>
    .hdr{fill:#e8f2ff;stroke:#146ce4;stroke-width:2;rx:12}
    .tab{fill:#14263a;rx:12}
    .tt{font-size:22px;font-weight:700;fill:#ffffff;text-anchor:middle}
    .box{fill:#ffffff;stroke:#14263a;stroke-width:1.8;rx:10}
    .bt{font-size:15.5px;fill:#14263a}
    .bb{font-size:15.5px;fill:#14263a;font-weight:700}
    .lay{fill:#fbecc4;stroke:#8a6a0f;stroke-width:1.8;rx:10}
    .tag{font-size:13px;letter-spacing:1.4px;fill:#8a6a0f;font-weight:700}
    .ln{stroke:#14263a;stroke-width:1.6;fill:none}
  </style>

  <text class="tag" x="0" y="16">STRUCTURAL WIREFRAME OF THE ANDROID APP, NOT A SCREENSHOT</text>

  <rect class="hdr" x="0" y="30" width="1000" height="62"/>
  <text class="bb" x="16" y="56">Header on every screen</text>
  <text class="bt" x="16" y="78">Area chip (tap to confirm or change)  ·  radio status chip  ·  Check for new messages  ·  About (diagnostics, APK sharing)</text>

  <!-- tabs -->
  <rect class="tab" x="0" y="116" width="235" height="48"/><text class="tt" x="117" y="148">Home</text>
  <rect class="tab" x="255" y="116" width="235" height="48"/><text class="tt" x="372" y="148">Request</text>
  <rect class="tab" x="510" y="116" width="235" height="48"/><text class="tt" x="627" y="148">Inbox</text>
  <rect class="tab" x="765" y="116" width="235" height="48"/><text class="tt" x="882" y="148">My activity</text>
  <path class="ln" d="M117,164 V184 M372,164 V184 M627,164 V184 M882,164 V184"/>

  <!-- Home -->
  <g transform="translate(0,186)">
    <rect class="box" width="235" height="74"/><text class="bb" x="12" y="26">Status and entry</text><text class="bt" x="12" y="48">Radio card, honest empty</text><text class="bt" x="12" y="66">state, recent arrivals</text>
    <rect class="box" y="88" width="235" height="62"/><text class="bt" x="12" y="114">“Request help” opens</text><text class="bt" x="12" y="134">the Request tab</text>
    <rect class="box" y="164" width="235" height="62"/><text class="bt" x="12" y="190">“Help others” opens</text><text class="bt" x="12" y="210">the Inbox tab</text>
    <rect class="box" y="240" width="235" height="62"/><text class="bt" x="12" y="266">“Share an update” opens</text><text class="bt" x="12" y="286">a bulletin sheet</text>
  </g>
  <!-- Request -->
  <g transform="translate(255,186)">
    <rect class="box" width="235" height="96"/><text class="bb" x="12" y="26">Urgent assistance</text><text class="bt" x="12" y="48">Category, urgency, lifetime,</text><text class="bt" x="12" y="66">public landmark, optional</text><text class="bt" x="12" y="84">private exact address</text>
    <rect class="box" y="110" width="235" height="96"/><text class="bb" x="12" y="136">Find someone</text><text class="bt" x="12" y="158">Who, identifying details,</text><text class="bt" x="12" y="176">last-known area, optional</text><text class="bt" x="12" y="194">photo</text>
    <rect class="box" y="220" width="235" height="82"/><text class="bb" x="12" y="246">Saved on this phone</text><text class="bt" x="12" y="268">Confirmation that makes no</text><text class="bt" x="12" y="286">delivery promise</text>
  </g>
  <!-- Inbox -->
  <g transform="translate(510,186)">
    <rect class="box" width="235" height="96"/><text class="bb" x="12" y="26">Inbox</text><text class="bt" x="12" y="48">New to you · Active help</text><text class="bt" x="12" y="66">requests · Earlier messages</text><text class="bt" x="12" y="84">(each message appears once)</text>
    <rect class="box" y="110" width="235" height="52"/><text class="bb" x="12" y="142">Community updates</text>
    <rect class="box" y="176" width="235" height="52"/><text class="bb" x="12" y="199">Search · Filters</text><text class="bt" x="12" y="217">local messages only</text>
    <rect class="box" y="242" width="235" height="96"/><text class="bb" x="12" y="268">Detail sheet</text><text class="bt" x="12" y="290">Send an offer, or share a</text><text class="bt" x="12" y="308">possible sighting. Read</text><text class="bt" x="12" y="326">state saved on the phone</text>
  </g>
  <!-- My activity -->
  <g transform="translate(765,186)">
    <rect class="box" width="235" height="62"/><text class="bb" x="12" y="26">Needs your attention</text><text class="bt" x="12" y="48">new offers, acknowledgments</text>
    <rect class="box" y="62" width="235" height="62"/><text class="bb" x="12" y="88">My requests</text><text class="bt" x="12" y="110">four-step status timeline</text>
    <rect class="box" y="138" width="235" height="96"/><text class="bb" x="12" y="164">Detail sheet</text><text class="bt" x="12" y="186">Acknowledge · share exact</text><text class="bt" x="12" y="204">address · renew or widen ·</text><text class="bt" x="12" y="222">mark resolved</text>
    <rect class="box" y="248" width="235" height="62"/><text class="bb" x="12" y="274">Offers I sent · My updates</text><text class="bt" x="12" y="296">offers, sightings, bulletins</text>
  </g>

  <!-- layers -->
  <text class="tag" x="0" y="528">LAYERS THAT CAN APPEAR OVER ANY SCREEN</text>
  <g transform="translate(0,540)">
    <rect class="lay" width="235" height="90"/><text class="bb" x="12" y="26">Your area sheet</text><text class="bt" x="12" y="48">“Still in …?” Yes, I moved,</text><text class="bt" x="12" y="66">Later; never over a draft</text>
    <rect class="lay" x="255" width="235" height="90"/><text class="bb" x="267" y="26">In-app pop-up</text><text class="bt" x="267" y="48">Important messages only;</text><text class="bt" x="267" y="66">several fold into one</text>
    <rect class="lay" x="510" width="235" height="90"/><text class="bb" x="522" y="26">Android notification</text><text class="bt" x="522" y="48">Opens the exact message;</text><text class="bt" x="522" y="66">generic on the lock screen</text>
    <rect class="lay" x="765" width="235" height="90"/><text class="bb" x="777" y="26">About</text><text class="bt" x="777" y="48">Radio status, field-test</text><text class="bt" x="777" y="66">diagnostics, APK sharing</text>
  </g>
</svg>
